{% extends 'base.html' %}
{% block title %}Sign in · Catch Up{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Welcome back</h1>
  <p class="muted">Sign in to continue learning.</p>
  <form method="post" novalidate>{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include 'partials/form_fields.html' %}
    <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
  </form>
  <div class="form-foot"><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></div>
  <div class="form-foot">New to Catch Up? <a href="{% url 'accounts:signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create a free account</a></div>
</div>
{% endblock %}
