{% extends 'base.html' %}
{% block title %}Check your email · Catch Up{% endblock %}
{% block content %}
<div class="card form-card" style="text-align:center">
  <div class="status-icon success"><svg class="icon"><use href="#i-mail"/></svg></div>
  <h1>Check your email</h1>
  <p class="muted">If an account exists for that address, a reset link is on its way. It can take a few minutes; check your spam folder too.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-outline btn-block">Back to sign in</a>
</div>
{% endblock %}
