{% extends 'base.html' %}
{% block title %}Password changed · Catch Up{% endblock %}
{% block content %}
<div class="card form-card" style="text-align:center">
  <div class="status-icon success"><svg class="icon"><use href="#i-check"/></svg></div>
  <h1>Password changed</h1>
  <p class="muted">You can now sign in with your new password.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block">Sign in</a>
</div>
{% endblock %}
