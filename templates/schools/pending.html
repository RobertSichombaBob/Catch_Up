{% extends 'base.html' %}
{% block title %}School not available · Catch Up{% endblock %}
{% block content %}
<div class="card form-card center" style="max-width:520px">
  <svg class="icon icon-lg"><use href="#i-clock"/></svg>
  <h1>{{ school.name }}</h1>
  <p class="muted">This school's page isn't public yet. If you're a member, join with the code your school gave you.</p>
  <a class="btn btn-primary" href="{% url 'schools:index' %}#join">Enter a join code</a>
</div>
{% endblock %}
