<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title|default:site_name }}</title></head>
<body style="margin:0;padding:0;background:#f6f7f4;font-family:Arial,Helvetica,sans-serif;color:#0d1b2a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f7f4;padding:24px 12px;">
<tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e3e7ec;border-radius:14px;">
    <tr><td style="padding:22px 28px;border-bottom:1px solid #e3e7ec;">
      <a href="{{ site_url }}" style="font-size:20px;font-weight:bold;color:#0e7a4f;text-decoration:none;">Catch Up</a>
    </td></tr>
    <tr><td style="padding:28px;font-size:15px;line-height:1.6;color:#33415c;">
      {% block body %}{% endblock %}
    </td></tr>
    <tr><td style="padding:18px 28px;border-top:1px solid #e3e7ec;font-size:12px;line-height:1.5;color:#5c677d;">
      Questions? Reply to {{ support_email }}.<br>
      You can turn off email notifications in your <a href="{{ site_url }}/accounts/profile/" style="color:#0e7a4f;">profile settings</a>.
    </td></tr>
  </table>
</td></tr></table>
</body></html>
